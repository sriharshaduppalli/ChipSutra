# ChipSutra — zero-configuration EDA copilot for verification.
# Run: docker compose up --build

services:
  # MongoDB — user data, projects, generations
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Ollama — local LLM server (zero API key required)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    # Uncomment the next 8 lines to use GPU acceleration if you have NVIDIA GPUs
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: pull base Qwen + create chipsutra-vlsi tag (see models/chipsutra-vlsi/ollama-bootstrap.sh).
  ollama-bootstrap:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
      - ./models/chipsutra-vlsi:/modelfiles:ro
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-chipsutra-vlsi:3b}
    entrypoint: ["/bin/sh", "/modelfiles/ollama-bootstrap.sh"]
    restart: "no"

  # ChipSutra backend — FastAPI + Verilator + Yosys + SBY
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ollama-bootstrap:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    env_file:
      # Optional: a fresh clone has no backend/.env yet, and the defaults below
      # are enough for the local stack.
      - path: ./backend/.env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017
      STORAGE_MODE: local
      STORAGE_LOCAL_PATH: /app/storage
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-chipsutra-vlsi:3b}
      # Optional shared rate-limit store: docker compose --profile redis up
      # REDIS_URL: redis://redis:6379/0
    volumes:
      - chipsutra_storage:/app/storage

  # Optional: shared rate limiter for multi-replica backends
  #   docker compose --profile redis up --build
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # React SPA served via nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo_data:
  ollama_data:
  chipsutra_storage:
