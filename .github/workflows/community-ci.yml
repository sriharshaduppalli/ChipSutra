name: ChipSutra Community CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.atlas.yml config --quiet
          docker compose -f docker-compose.backend-verilator.yml config --quiet
          docker compose -f docker-compose.prod.yml --env-file deploy/env.prod.example config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OSS backend deps
        run: pip install -r backend/requirements-oss.txt

      - name: Byte-compile backend
        run: python -m compileall -q backend

      - name: Guard against line-number corruption in sources
        run: python scripts/check_source_sanity.py

      - name: Offline backend test suite
        run: python scripts/run_offline_tests.py

      - name: Modelfiles present
        run: test -f models/chipsutra-vlsi/Modelfile.3b

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install and build
        env:
          CI: "true"
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

  golden-rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint golden DUTs
        working-directory: backend/knowledge/golden
        run: |
          verilator --lint-only -Wall fifo.sv
          verilator --lint-only -Wall axi_lite_slave.sv

      - name: Lint golden testbenches with their DUT
        working-directory: backend/knowledge/golden
        # A testbench cannot resolve its DUT standalone, and needs --timing for delays.
        run: |
          verilator --lint-only --timing --top-module fifo_tb fifo.sv fifo_tb.sv
          verilator --lint-only --timing --top-module axi_lite_slave_tb \
            axi_lite_slave.sv axi_lite_slave_tb.sv
