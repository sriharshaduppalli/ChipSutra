name: ChipSutra Community CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.atlas.yml config --quiet
          docker compose -f docker-compose.backend-verilator.yml config --quiet
          docker compose -f docker-compose.prod.yml --env-file deploy/env.prod.example config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OSS backend deps
        run: pip install -r backend/requirements-oss.txt

      - name: Offline backend checks (Ollama / compose / env / RAG)
        run: |
          cd backend
          pytest tests/test_iteration_5.py tests/test_rag_and_golden.py tests/test_rtl_ports_and_feedback.py tests/test_eda_industry.py tests/test_credibility_targets.py -n 0 \
            -k "docker_compose or env_example or requirements or readme or available_providers or stream_chat or rag or golden or lint_policy or lint_waiver or yosys or cocotb"

      - name: Modelfiles present
        run: test -f models/chipsutra-vlsi/Modelfile.3b

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build
