name: Sync ChipSutra-VLSI modelfiles

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "ChipSutra-VLSI-LLM git ref (branch/tag)"
        required: false
        default: master

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream LLM repo
        run: |
          git clone --depth 1 --branch "${{ inputs.upstream_ref }}" \
            https://github.com/sriharshaduppalli/ChipSutra-VLSI-LLM.git /tmp/vlsi-llm

      - name: Copy modelfiles + VERSION + RAG knowledge
        run: |
          cp /tmp/vlsi-llm/modelfiles/Modelfile.* models/chipsutra-vlsi/
          cp /tmp/vlsi-llm/VERSION models/chipsutra-vlsi/VERSION
          mkdir -p backend/knowledge
          for f in vlsi_protocols_compact.txt vlsi_soc_dft_power.txt vlsi_verification_glossary.txt; do
            cp "/tmp/vlsi-llm/prompts/$f" "backend/knowledge/$f"
          done
          chmod +x models/chipsutra-vlsi/ollama-bootstrap.sh

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Sync models/chipsutra-vlsi from ChipSutra-VLSI-LLM."
          title: "Sync ChipSutra-VLSI modelfiles (${{ inputs.upstream_ref }})"
          body: |
            Automated sync from [ChipSutra-VLSI-LLM](https://github.com/sriharshaduppalli/ChipSutra-VLSI-LLM) `${{ inputs.upstream_ref }}`.
            Review Modelfile diffs before merge.
          branch: sync/vlsi-modelfiles
