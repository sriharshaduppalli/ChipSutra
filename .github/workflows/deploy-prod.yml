name: Deploy chipsutra.org

# Removes the manual "ssh in, git pull, docker compose up --build" step.
# Runs only after Community CI succeeds on main, or on demand.

on:
  workflow_run:
    workflows: ["ChipSutra Community CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires even on failure; only ship green builds.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: gate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "DEPLOY_HOST not set — skipping (configure secrets per docs/AUTOMATION.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH || '/opt/chipsutra' }}"
            ./scripts/deploy-prod.sh "${{ inputs.ref || 'main' }}"

      - name: Post-deploy smoke test
        if: steps.gate.outputs.ready == 'true'
        run: |
          chmod +x scripts/prod-smoke.sh
          ./scripts/prod-smoke.sh \
            "${{ secrets.PUBLIC_API_URL || 'https://api.chipsutra.org' }}" \
            "${{ secrets.PUBLIC_APP_URL || 'https://chipsutra.org' }}"
