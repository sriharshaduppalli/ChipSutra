# ChipSutra without local MongoDB (skip `docker pull mongo:6`)
# Use free MongoDB Atlas: https://www.mongodb.com/cloud/atlas/register
#
# 1. Create a free M0 cluster — full steps: docs/MONGODB_ATLAS_SETUP.md
# 2. Database Access -> user + password
# 3. Network Access -> Add IP -> Allow access from anywhere (0.0.0.0/0) for dev
# 4. Connect -> Drivers -> copy connection string
# 5. Put in backend/.env:
#      MONGO_URL="mongodb+srv://USER:PASS@cluster....mongodb.net/chipsutra_db?retryWrites=true&w=majority"
#
# 6. Run:
#      docker compose -f docker-compose.atlas.yml up --build

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6

  ollama-bootstrap:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
      - ./models/chipsutra-vlsi:/modelfiles:ro
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-chipsutra-vlsi:3b}
    entrypoint: ["/bin/sh", "/modelfiles/ollama-bootstrap.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ollama-bootstrap:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      STORAGE_MODE: local
      STORAGE_LOCAL_PATH: /app/storage
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-chipsutra-vlsi:3b}
    volumes:
      - chipsutra_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:8001
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  ollama_data:
  chipsutra_storage:
